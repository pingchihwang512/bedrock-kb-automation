name: Deploy Peony Tours to Bedrock KB  # 1. 換上專屬名稱

on:
  push:
    branches: [main]
    paths: ["peony-tours/*.md"]  # 2. 改為只監聽 peony-tours 資料夾

permissions:
  id-token: write 
  contents: read 

jobs:
  sync-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install boto3 pyyaml

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 未來若 ai-chatbot 在不同 AWS 帳號，這裡的變數可改為別的 例如PEONY_AWS_ROLE_ARN
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Process and Sync
        env:
          S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
          KNOWLEDGE_BASE_ID: ${{ secrets.KNOWLEDGE_BASE_ID }}
          DATA_SOURCE_ID: ${{ secrets.DATA_SOURCE_ID }}
          TARGET_FOLDER: "peony-tours"  # 3. 告訴 Python 腳本這次要處理哪個資料夾
        run: python scripts/sync_to_bedrock.py
