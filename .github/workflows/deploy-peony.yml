name: Deploy Peony Tours to Bedrock KB

on:
  push:
    branches: [main]
    paths: ["peony-tours/*.md"]

# 💡 加入排隊機制：確保此 Workflow 一次只有一個任務在執行
concurrency:
  group: sync-peony-tour
  cancel-in-progress: false  # 讓後面的 push 排隊等待前一個完成，不中斷

permissions:
  id-token: write 
  contents: read 

jobs:
  sync-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install boto3 pyyaml

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com  # 補上這行，確保 AWS STS 成功驗證 OIDC
          role-skip-session-tagging: true    # 加這行 經典的坑，官方文件也有特別提到 要呼叫 sts:TagSession 這個 API
          
      - name: Process and Sync
        env:
          S3_BUCKET_NAME: ${{ vars.PEONY_S3_BUCKET_NAME }}
          KNOWLEDGE_BASE_ID: ${{ secrets.PEONY_KNOWLEDGE_BASE_ID }}
          DATA_SOURCE_ID: ${{ secrets.PEONY_DATA_SOURCE_ID }}
          TARGET_FOLDER: "peony-tours"
        run: python scripts/sync_to_bedrock.py
