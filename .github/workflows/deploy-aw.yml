name: Deploy Affordable World to Bedrock KB

on:
  push:
    branches: [main]
    paths: ["aw-tours/*.md"]

permissions:
  id-token: write 
  contents: read 

jobs:
  sync-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install boto3 pyyaml

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Process and Sync
        env:
          S3_BUCKET_NAME: ${{ vars.AW_S3_BUCKET_NAME }}
          KNOWLEDGE_BASE_ID: ${{ secrets.AW_KNOWLEDGE_BASE_ID }}
          DATA_SOURCE_ID: ${{ secrets.AW_DATA_SOURCE_ID }}
          TARGET_FOLDER: "aw-tours"
        run: python scripts/sync_to_bedrock.py
